# Fly.io ClamAV Configuration
# Deploy: fly launch --no-deploy --name vmms-clamav --region iad --copy-config
# Then: fly deploy

app = "vmms-clamav"
primary_region = "iad"

[build]
  image = "clamav/clamav:1.4"

[env]
  CLAMD_CONF_LOG_TIME = "yes"
  CLAMD_CONF_LOG_VERBOSE = "yes"
  CLAMD_CONF_DATABASE_DIRECTORY = "/var/lib/clamav"
  CLAMD_CONF_LOCAL_SOCKET = "/run/clamav/clamd.sock"
  CLAMD_CONF_TCP_ADDR = "0.0.0.0"
  CLAMD_CONF_TCP_PORT = "3310"
  FRESHCLAM_CONF_DATABASE_DIRECTORY = "/var/lib/clamav"
  FRESHCLAM_CONF_CHECKS = "24"
  FRESHCLAM_CONF_DATABASE_MIRROR = "database.clamav.net"

[mounts]
  source = "clamav_data"
  destination = "/var/lib/clamav"

[processes]
  clamd = "clamd --foreground"
  freshclam = "freshclam --foreground --daemon --checks=24"

[services.clamd]
  internal_port = 3310
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[services.clamd.ports]]
    port = 3310
    handlers = ["tls"]

  [[services.clamd.tcp_checks]]
    interval = 30000
    timeout = 10000
    grace_period = "30s"

[services.freshclam]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1