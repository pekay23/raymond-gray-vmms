# Oracle Cloud Free Tier VM: Keycloak + PostgreSQL + ClamAV
# Run: docker compose -f docker-compose.oracle.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start", "--optimized", "--http-enabled=true", "--health-enabled=true", "--hostname=auth.raymond-gray.org", "--hostname-strict=true", "--hostname-strict-https=true", "--proxy=edge"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: "INFO"
      KC_SPI_THEME_STATIC_MAX_AGE: "86400"
      KC_SPI_THEME_CACHE_THEMES: "true"
      KC_SPI_THEME_CACHE_TEMPLATES: "true"
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./themes:/opt/keycloak/themes:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    environment:
      CLAMD_CONF_LOG_TIME: "yes"
      CLAMD_CONF_LOG_VERBOSE: "yes"
      CLAMD_CONF_DATABASE_DIRECTORY: "/var/lib/clamav"
      CLAMD_CONF_LOCAL_SOCKET: "/run/clamav/clamd.sock"
      CLAMD_CONF_TCP_ADDR: "0.0.0.0"
      CLAMD_CONF_TCP_PORT: "3310"
      FRESHCLAM_CONF_DATABASE_DIRECTORY: "/var/lib/clamav"
      FRESHCLAM_CONF_CHECKS: "24"
      FRESHCLAM_CONF_DATABASE_MIRROR: "database.clamav.net"
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --fdpass /dev/null || exit 1"]
      interval: 300s
      timeout: 30s
      retries: 3
      start_period: 180s

volumes:
  postgres_data:
  keycloak_data:
  clamav_data:

networks:
  default:
    name: raymond-gray-auth-network