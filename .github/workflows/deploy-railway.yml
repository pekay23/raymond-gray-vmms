name: Deploy API to Railway

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy API to Railway
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Link to Railway project
        run: railway link --project ${{ secrets.RAILWAY_PROJECT_ID }}

      - name: Set Railway environment variables
        run: |
          railway variable set DATABASE_URL="${{ secrets.DATABASE_URL }}" --service vmms-api
          railway variable set MIGRATION_DATABASE_URL="${{ secrets.MIGRATION_DATABASE_URL }}" --service vmms-api
          railway variable set SESSION_SECRET="${{ secrets.SESSION_SECRET }}" --service vmms-api
          railway variable set OIDC_ISSUER="${{ secrets.OIDC_ISSUER }}" --service vmms-api
          railway variable set OIDC_CLIENT_ID="${{ secrets.OIDC_CLIENT_ID }}" --service vmms-api
          railway variable set OIDC_CLIENT_SECRET="${{ secrets.OIDC_CLIENT_SECRET }}" --service vmms-api
          railway variable set OIDC_CALLBACK_URL="${{ secrets.OIDC_CALLBACK_URL }}" --service vmms-api
          railway variable set OIDC_LOGOUT_CALLBACK_URL="${{ secrets.OIDC_LOGOUT_CALLBACK_URL }}" --service vmms-api
          railway variable set VMMS_EVIDENCE_S3_ENDPOINT="${{ secrets.VMMS_EVIDENCE_S3_ENDPOINT }}" --service vmms-api
          railway variable set VMMS_EVIDENCE_S3_BUCKET="${{ secrets.VMMS_EVIDENCE_S3_BUCKET }}" --service vmms-api
          railway variable set VMMS_EVIDENCE_S3_REGION="${{ secrets.VMMS_EVIDENCE_S3_REGION }}" --service vmms-api
          railway variable set VMMS_EVIDENCE_S3_ACCESS_KEY_ID="${{ secrets.VMMS_EVIDENCE_S3_ACCESS_KEY_ID }}" --service vmms-api
          railway variable set VMMS_EVIDENCE_S3_SECRET_ACCESS_KEY="${{ secrets.VMMS_EVIDENCE_S3_SECRET_ACCESS_KEY }}" --service vmms-api
          railway variable set VMMS_EVIDENCE_WORKER_S3_ACCESS_KEY_ID="${{ secrets.VMMS_EVIDENCE_WORKER_S3_ACCESS_KEY_ID }}" --service vmms-api
          railway variable set VMMS_EVIDENCE_WORKER_S3_SECRET_ACCESS_KEY="${{ secrets.VMMS_EVIDENCE_WORKER_S3_SECRET_ACCESS_KEY }}" --service vmms-api
          railway variable set VMMS_EVIDENCE_CLAMAV_HOST="${{ secrets.VMMS_EVIDENCE_CLAMAV_HOST }}" --service vmms-api
          railway variable set VMMS_EVIDENCE_CLAMAV_PORT="${{ secrets.VMMS_EVIDENCE_CLAMAV_PORT }}" --service vmms-api
          railway variable set TRUSTED_PROXY_CIDRS="${{ secrets.TRUSTED_PROXY_CIDRS }}" --service vmms-api
          railway variable set NODE_ENV=staging --service vmms-api
          railway variable set WEB_ORIGIN=https://vmms.raymond-gray.org --service vmms-api
          railway variable set PORT=4100 --service vmms-api
          railway variable set HOST=0.0.0.0 --service vmms-api

      - name: Deploy API service
        run: railway up --service vmms-api --detach
        working-directory: apps/api