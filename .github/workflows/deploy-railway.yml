name: Deploy API to Railway

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy API to Railway
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Link to Railway project
        run: railway link --project ${{ secrets.RAILWAY_PROJECT_ID }}

      - name: Set Railway environment variables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          OIDC_CALLBACK_URL: ${{ secrets.OIDC_CALLBACK_URL }}
          OIDC_LOGOUT_CALLBACK_URL: ${{ secrets.OIDC_LOGOUT_CALLBACK_URL }}
          VMMS_EVIDENCE_S3_ENDPOINT: ${{ secrets.VMMS_EVIDENCE_S3_ENDPOINT }}
          VMMS_EVIDENCE_S3_BUCKET: ${{ secrets.VMMS_EVIDENCE_S3_BUCKET }}
          VMMS_EVIDENCE_S3_REGION: ${{ secrets.VMMS_EVIDENCE_S3_REGION }}
          VMMS_EVIDENCE_S3_ACCESS_KEY_ID: ${{ secrets.VMMS_EVIDENCE_S3_ACCESS_KEY_ID }}
          VMMS_EVIDENCE_S3_SECRET_ACCESS_KEY: ${{ secrets.VMMS_EVIDENCE_S3_SECRET_ACCESS_KEY }}
          VMMS_EVIDENCE_WORKER_S3_ACCESS_KEY_ID: ${{ secrets.VMMS_EVIDENCE_WORKER_S3_ACCESS_KEY_ID }}
          VMMS_EVIDENCE_WORKER_S3_SECRET_ACCESS_KEY: ${{ secrets.VMMS_EVIDENCE_WORKER_S3_SECRET_ACCESS_KEY }}
          VMMS_EVIDENCE_CLAMAV_HOST: ${{ secrets.VMMS_EVIDENCE_CLAMAV_HOST }}
          VMMS_EVIDENCE_CLAMAV_PORT: ${{ secrets.VMMS_EVIDENCE_CLAMAV_PORT }}
          TRUSTED_PROXY_CIDRS: ${{ secrets.TRUSTED_PROXY_CIDRS }}
          WEB_ORIGIN: ${{ secrets.WEB_ORIGIN }}
        run: |
          node -e "
          const vars = {
            DATABASE_URL: process.env.DATABASE_URL,
            MIGRATION_DATABASE_URL: process.env.MIGRATION_DATABASE_URL,
            SESSION_SECRET: process.env.SESSION_SECRET,
            OIDC_ISSUER: process.env.OIDC_ISSUER,
            OIDC_CLIENT_ID: process.env.OIDC_CLIENT_ID,
            OIDC_CLIENT_SECRET: process.env.OIDC_CLIENT_SECRET,
            OIDC_CALLBACK_URL: process.env.OIDC_CALLBACK_URL,
            OIDC_LOGOUT_CALLBACK_URL: process.env.OIDC_LOGOUT_CALLBACK_URL,
            VMMS_EVIDENCE_S3_ENDPOINT: process.env.VMMS_EVIDENCE_S3_ENDPOINT,
            VMMS_EVIDENCE_S3_BUCKET: process.env.VMMS_EVIDENCE_S3_BUCKET,
            VMMS_EVIDENCE_S3_REGION: process.env.VMMS_EVIDENCE_S3_REGION,
            VMMS_EVIDENCE_S3_ACCESS_KEY_ID: process.env.VMMS_EVIDENCE_S3_ACCESS_KEY_ID,
            VMMS_EVIDENCE_S3_SECRET_ACCESS_KEY: process.env.VMMS_EVIDENCE_S3_SECRET_ACCESS_KEY,
            VMMS_EVIDENCE_WORKER_S3_ACCESS_KEY_ID: process.env.VMMS_EVIDENCE_WORKER_S3_ACCESS_KEY_ID,
            VMMS_EVIDENCE_WORKER_S3_SECRET_ACCESS_KEY: process.env.VMMS_EVIDENCE_WORKER_S3_SECRET_ACCESS_KEY,
            VMMS_EVIDENCE_CLAMAV_HOST: process.env.VMMS_EVIDENCE_CLAMAV_HOST,
            VMMS_EVIDENCE_CLAMAV_PORT: process.env.VMMS_EVIDENCE_CLAMAV_PORT,
            TRUSTED_PROXY_CIDRS: process.env.TRUSTED_PROXY_CIDRS,
            WEB_ORIGIN: process.env.WEB_ORIGIN,
            NODE_ENV: 'staging',
            PORT: '4100',
            HOST: '0.0.0.0'
          };
          console.log(JSON.stringify(vars));
          " > /tmp/vars.json
          railway variables set --service @vmms/api --json "$(cat /tmp/vars.json)"

      - name: Deploy API service
        run: railway up --service @vmms/api --detach
        working-directory: apps/api