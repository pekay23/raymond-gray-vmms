name: Deploy API to Railway

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy API to Railway
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Login to Railway
        run: echo "${{ secrets.RAILWAY_TOKEN }}" | railway login --stdin

      - name: Link to Railway project
        run: railway link ${{ secrets.RAILWAY_PROJECT_ID }}

      - name: Deploy API service
        run: railway up --service vmms-api --detach
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          OIDC_CALLBACK_URL: ${{ secrets.OIDC_CALLBACK_URL }}
          VMMS_EVIDENCE_S3_ENDPOINT: ${{ secrets.VMMS_EVIDENCE_S3_ENDPOINT }}
          VMMS_EVIDENCE_S3_BUCKET: ${{ secrets.VMMS_EVIDENCE_S3_BUCKET }}
          VMMS_EVIDENCE_S3_REGION: ${{ secrets.VMMS_EVIDENCE_S3_REGION }}
          VMMS_EVIDENCE_S3_ACCESS_KEY_ID: ${{ secrets.VMMS_EVIDENCE_S3_ACCESS_KEY_ID }}
          VMMS_EVIDENCE_S3_SECRET_ACCESS_KEY: ${{ secrets.VMMS_EVIDENCE_S3_SECRET_ACCESS_KEY }}
          VMMS_EVIDENCE_WORKER_S3_ACCESS_KEY_ID: ${{ secrets.VMMS_EVIDENCE_WORKER_S3_ACCESS_KEY_ID }}
          VMMS_EVIDENCE_WORKER_S3_SECRET_ACCESS_KEY: ${{ secrets.VMMS_EVIDENCE_WORKER_S3_SECRET_ACCESS_KEY }}
          VMMS_EVIDENCE_CLAMAV_HOST: ${{ secrets.VMMS_EVIDENCE_CLAMAV_HOST }}
          VMMS_EVIDENCE_CLAMAV_PORT: ${{ secrets.VMMS_EVIDENCE_CLAMAV_PORT }}
          TRUSTED_PROXY_CIDRS: ${{ secrets.TRUSTED_PROXY_CIDRS }}