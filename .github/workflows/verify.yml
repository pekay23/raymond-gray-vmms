name: VMMS verification

'on':
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vmms-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: vmms_owner
          POSTGRES_PASSWORD: vmms_local_development_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vmms_owner -d postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgres://vmms_owner:vmms_local_development_only@127.0.0.1:5432/postgres
      DATABASE_URL: postgres://vmms_runtime:vmms_runtime_local_development_only@127.0.0.1:5432/postgres
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci
      - name: Verify traceability, types, builds and PostgreSQL integration
        run: npm run verify
