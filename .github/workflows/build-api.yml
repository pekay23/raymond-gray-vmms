name: Build and Push VMMS API Container

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
  security-events: write

concurrency:
  group: vmms-api-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: raymond-gray/vmms-api

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Run tests
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm \
            -e DATABASE_URL=postgresql://test:test@localhost:5432/test \
            -e SESSION_SECRET=test-secret-test-secret-test-secret \
            -e OIDC_ISSUER=http://localhost:8080/realms/test \
            -e OIDC_CLIENT_ID=test \
            -e OIDC_CLIENT_SECRET=test \
            -e OIDC_CALLBACK_URL=http://localhost:4100/api/v1/auth/oidc/callback \
            -e VMMS_EVIDENCE_S3_ENDPOINT=http://localhost:9000 \
            -e VMMS_EVIDENCE_S3_BUCKET=test \
            -e VMMS_EVIDENCE_S3_REGION=us-east-1 \
            -e VMMS_EVIDENCE_S3_ACCESS_KEY_ID=test \
            -e VMMS_EVIDENCE_S3_SECRET_ACCESS_KEY=test \
            -e VMMS_EVIDENCE_WORKER_S3_ACCESS_KEY_ID=test \
            -e VMMS_EVIDENCE_WORKER_S3_SECRET_ACCESS_KEY=test \
            -e VMMS_EVIDENCE_CLAMAV_HOST=localhost \
            -e VMMS_EVIDENCE_CLAMAV_PORT=3310 \
            -e PORT=4100 \
            -e HOST=0.0.0.0 \
            ${{ steps.build.outputs.imageid }} \
            npm test

      - name: Vulnerability scan (Trivy)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'image'
          scan-ref: '${{ steps.build.outputs.imageid }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Output image digest
        run: |
          echo "Image digest: ${{ steps.build.outputs.digest }}"
          echo "Image tags: ${{ steps.meta.outputs.tags }}"
