name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: '24'
  DATABASE_URL: "postgresql://test:test@localhost:5432/test"
  MIGRATION_DATABASE_URL: "postgresql://test:test@localhost:5432/test"
  SESSION_SECRET: "test-secret-for-ci-only"
  OIDC_ISSUER: "https://test.example.com/realms/test"
  OIDC_CLIENT_ID: "test-client"
  OIDC_CLIENT_SECRET: "test-secret"
  OIDC_CALLBACK_URL: "https://test.example.com/callback"
  VMMS_EVIDENCE_S3_ENDPOINT: "https://test.r2.cloudflarestorage.com"
  VMMS_EVIDENCE_S3_BUCKET: "test-bucket"
  VMMS_EVIDENCE_S3_REGION: "auto"
  VMMS_EVIDENCE_S3_ACCESS_KEY_ID: "test"
  VMMS_EVIDENCE_S3_SECRET_ACCESS_KEY: "test"
  VMMS_EVIDENCE_WORKER_S3_ACCESS_KEY_ID: "test"
  VMMS_EVIDENCE_WORKER_S3_SECRET_ACCESS_KEY: "test"
  VMMS_EVIDENCE_CLAMAV_HOST: "localhost"
  VMMS_EVIDENCE_CLAMAV_PORT: "3310"
  TRUSTED_PROXY_CIDRS: "127.0.0.1/32"

jobs:
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run assets:generate --workspace @vmms/web
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run assets:generate --workspace @vmms/web
      - run: npm run test --workspace @vmms/web

  verify:
    name: PostgreSQL Verification
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vmms
          POSTGRES_USER: vmms_owner
          POSTGRES_PASSWORD: vmms_local_development_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vmms_owner -d vmms"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgres://vmms_owner:vmms_local_development_only@127.0.0.1:5432/vmms
      DATABASE_URL: postgres://vmms_runtime:vmms_runtime_local_development_only@127.0.0.1:5432/vmms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create runtime role
        run: |
          psql "postgres://vmms_owner:vmms_local_development_only@127.0.0.1:5432/vmms" -c "
            CREATE ROLE vmms_runtime WITH LOGIN PASSWORD 'vmms_runtime_local_development_only';
            GRANT USAGE ON SCHEMA public TO vmms_runtime;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO vmms_runtime;
          "
      - run: npm ci
      - run: npm run verify

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [typecheck, test, verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace @vmms/web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: [typecheck, test, verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace @vmms/api
      - uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist
          retention-days: 1

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build-web, build-api]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
