name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: '24'
  # Dummy values for tests that require DATABASE_URL
  DATABASE_URL: "postgresql://test:test@localhost:5432/test"
  MIGRATION_DATABASE_URL: "postgresql://test:test@localhost:5432/test"
  SESSION_SECRET: "test-secret-for-ci-only"
  OIDC_ISSUER: "https://test.example.com/realms/test"
  OIDC_CLIENT_ID: "test-client"
  OIDC_CLIENT_SECRET: "test-secret"
  OIDC_CALLBACK_URL: "https://test.example.com/callback"
  VMMS_EVIDENCE_S3_ENDPOINT: "https://test.r2.cloudflarestorage.com"
  VMMS_EVIDENCE_S3_BUCKET: "test-bucket"
  VMMS_EVIDENCE_S3_REGION: "auto"
  VMMS_EVIDENCE_S3_ACCESS_KEY_ID: "test"
  VMMS_EVIDENCE_S3_SECRET_ACCESS_KEY: "test"
  VMMS_EVIDENCE_WORKER_S3_ACCESS_KEY_ID: "test"
  VMMS_EVIDENCE_WORKER_S3_SECRET_ACCESS_KEY: "test"
  VMMS_EVIDENCE_CLAMAV_HOST: "localhost"
  VMMS_EVIDENCE_CLAMAV_PORT: "3310"
  TRUSTED_PROXY_CIDRS: "127.0.0.1/32"

jobs:
  generate-assets:
    name: Generate Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate web assets
        run: npm run assets:generate --workspace @vmms/web

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    needs: [generate-assets]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [generate-assets]
    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      MIGRATION_DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      SESSION_SECRET: "test-secret-for-ci-only"
      OIDC_ISSUER: "https://test.example.com/realms/test"
      OIDC_CLIENT_ID: "test-client"
      OIDC_CLIENT_SECRET: "test-secret"
      OIDC_CALLBACK_URL: "https://test.example.com/callback"
      VMMS_EVIDENCE_S3_ENDPOINT: "https://test.r2.cloudflarestorage.com"
      VMMS_EVIDENCE_S3_BUCKET: "test-bucket"
      VMMS_EVIDENCE_S3_REGION: "auto"
      VMMS_EVIDENCE_S3_ACCESS_KEY_ID: "test"
      VMMS_EVIDENCE_S3_SECRET_ACCESS_KEY: "test"
      VMMS_EVIDENCE_WORKER_S3_ACCESS_KEY_ID: "test"
      VMMS_EVIDENCE_WORKER_S3_SECRET_ACCESS_KEY: "test"
      VMMS_EVIDENCE_CLAMAV_HOST: "localhost"
      VMMS_EVIDENCE_CLAMAV_PORT: "3310"
      TRUSTED_PROXY_CIDRS: "127.0.0.1/32"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build --workspace @vmms/web

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      MIGRATION_DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      SESSION_SECRET: "test-secret-for-ci-only"
      OIDC_ISSUER: "https://test.example.com/realms/test"
      OIDC_CLIENT_ID: "test-client"
      OIDC_CLIENT_SECRET: "test-secret"
      OIDC_CALLBACK_URL: "https://test.example.com/callback"
      VMMS_EVIDENCE_S3_ENDPOINT: "https://test.r2.cloudflarestorage.com"
      VMMS_EVIDENCE_S3_BUCKET: "test-bucket"
      VMMS_EVIDENCE_S3_REGION: "auto"
      VMMS_EVIDENCE_S3_ACCESS_KEY_ID: "test"
      VMMS_EVIDENCE_S3_SECRET_ACCESS_KEY: "test"
      VMMS_EVIDENCE_WORKER_S3_ACCESS_KEY_ID: "test"
      VMMS_EVIDENCE_WORKER_S3_SECRET_ACCESS_KEY: "test"
      VMMS_EVIDENCE_CLAMAV_HOST: "localhost"
      VMMS_EVIDENCE_CLAMAV_PORT: "3310"
      TRUSTED_PROXY_CIDRS: "127.0.0.1/32"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build --workspace @vmms/api

      - name: Upload API build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist
          retention-days: 1

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [typecheck, test, build-web, build-api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}